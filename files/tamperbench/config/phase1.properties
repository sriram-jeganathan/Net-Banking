# Phase 1 decision register (machine-readable). Every value here is a decision
# the paper leaves free (Section V-A) and must be held constant across runs.

# --- Hashing (D5,D6,D7) ---
hash.algorithm         = SHA-256
chain.seed.hex         = 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff

# --- Canonical serialization sigma (D3) ---
serialization.format   = length-prefixed-utf8-v1
serialization.lenBytes = 4
serialization.endian   = big
# --- Field set and order entering the hash (D1,D2) ---
fields.order           = seq,txid,type,src,dst,amount,timestamp

# --- Workload generator (D8,D9,D10,D11) ---
workload.rng           = java.util.Random
workload.seed          = 42
workload.accounts      = 1000
workload.mix.create    = 0.05
workload.mix.deposit   = 0.25
workload.mix.withdraw  = 0.25
workload.mix.transfer  = 0.45
workload.amount.min    = 1
workload.amount.max    = 100000
workload.amount.dist   = uniform
# DECISION: account selection is uniform in Phase 1. The paper cites Zipfian as
# an example only. Zipfian skew is deferred to a Phase 2 sensitivity variant so
# the baseline is the simplest defensible default. Recorded, not silent.
workload.account.dist  = uniform
workload.initialBalance= 10000000
currency.unit          = minor-integer

# --- Deterministic logical clock (D4) ---
# Reference vectors need stable timestamps, so the generator assigns a logical
# clock. In the live system the timestamp is the DB commit time; conformance is
# validated by feeding identical field values, not by matching wall-clock time.
clock.base.micros      = 1704067200000000
clock.tick.micros      = 1000
